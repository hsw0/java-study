# https://docs.gradle.org/8.0.2/userguide/platforms.html#sub::toml-dependencies-format
[metadata]
format.version = "1.1"

[versions]
kotlin = "2.2.21"
logback = "1.5.22"
junit = "6.0.1"
spring-boot = "4.0.1"
spotless = "8.1.0"
errorprone = "2.43.0"
checkerframework = "3.49.3-eisop1"
jacoco = "0.8.14"

[libraries]
bom-kotlin = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
bom-kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version = "1.10.2" }

gradlePlugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
# https://kotlinlang.org/docs/all-open-plugin.html
# spring variant 등도 포함
gradlePlugin-kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
# https://kotlinlang.org/docs/no-arg-plugin.html
# jpa
gradlePlugin-kotlin-noarg = { module = "org.jetbrains.kotlin:kotlin-noarg", version.ref = "kotlin" }

gradlePlugin-springBoot = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
gradlePlugin-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
gradlePlugin-detekt = { module = "dev.detekt:dev.detekt.gradle.plugin", version = "2.0.0-alpha.1" }
gradlePlugin-errorprone = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version = "4.3.0" }
gradlePlugin-checkerframework = { module = "org.checkerframework:checkerframework-gradle-plugin", version = "0.6.61" }

bom-slf4j = { module = "org.slf4j:slf4j-bom", version = "2.0.17" }
bom-junit = { module = "org.junit:junit-bom", version.ref = "junit" }
bom-assertj = { module = "org.assertj:assertj-bom", version = "3.27.6" }
bom-kotest = { module = "io.kotest:kotest-bom", version = "6.0.4" }
bom-springBoot = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
bom-springCloud-commons = { module = "org.springframework.cloud:spring-cloud-commons-dependencies", version = "5.0.0" }

logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

guava = { module = "com.google.guava:guava", version = "33.5.0-jre" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version = "7.0.13" }

reactor-blockhound = { module = "io.projectreactor.tools:blockhound", version = "1.0.15.RELEASE" }

errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone" }
checkerframework = { module = "io.github.eisop:checker", version.ref = "checkerframework" }
checkerframework-qual = { module = "io.github.eisop:checker-qual", version.ref = "checkerframework" }
checkerframework-annotatedJdk = { module = "org.checkerframework:jdk8", version = "3.3.0" }

[bundles]
bomDependencies = [
  # kotlin은 별도 지정
  "bom-slf4j",
  "bom-junit",
  "bom-assertj",
  "bom-kotest",
]

dependencies = [
  "logback-core", "logback-classic",
  "guava",
  "kotlin-logging",
  "reactor-blockhound",
  "errorprone-core", "errorprone-annotations",
  "checkerframework", "checkerframework-qual", "checkerframework-annotatedJdk"
]

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
